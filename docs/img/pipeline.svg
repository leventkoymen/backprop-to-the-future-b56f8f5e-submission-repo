<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>LungPair agent pipeline</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b93b8"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="16" fill="#0b1029"/>
  <text x="32" y="44" fill="#ffffff" font-size="22" font-weight="700">How LungPair answers one question</text>
  <text x="32" y="70" fill="#a9b0d6" font-size="14">Gemini models plan, read and check. Plain Python does every number. A scientist signs off.</text>

  <!-- row 1 -->
  <g>
    <rect x="32" y="100" width="190" height="96" rx="12" fill="#1b2350" stroke="#3a4486"/>
    <text x="48" y="128" fill="#ffffff" font-size="15" font-weight="700">1 · Question</text>
    <text x="48" y="152" fill="#cfd4f0" font-size="13">Scientist or judge types</text>
    <text x="48" y="170" fill="#cfd4f0" font-size="13">"What should a lab screen</text>
    <text x="48" y="188" fill="#cfd4f0" font-size="13">with gefitinib next?"</text>
  </g>
  <g>
    <rect x="262" y="100" width="200" height="96" rx="12" fill="#2a1f5c" stroke="#7c6cf0"/>
    <text x="278" y="128" fill="#ffffff" font-size="15" font-weight="700">2 · Orchestrator agent</text>
    <text x="278" y="150" fill="#c9c1ff" font-size="12.5" font-family="ui-monospace, Menlo, monospace">gemini-4-argon</text>
    <text x="278" y="172" fill="#cfd4f0" font-size="13">Finds the drugs, picks</text>
    <text x="278" y="190" fill="#cfd4f0" font-size="13">which tools to call</text>
  </g>
  <g>
    <rect x="502" y="100" width="200" height="96" rx="12" fill="#10352f" stroke="#2fd6a8"/>
    <text x="518" y="128" fill="#ffffff" font-size="15" font-weight="700">3 · Ranker tool</text>
    <text x="518" y="150" fill="#9ff0d6" font-size="12.5" font-family="ui-monospace, Menlo, monospace">Python · random forest</text>
    <text x="518" y="172" fill="#cfd4f0" font-size="13">Score, 95% interval,</text>
    <text x="518" y="190" fill="#cfd4f0" font-size="13">evidence tier 1–4</text>
  </g>
  <g>
    <rect x="742" y="100" width="186" height="96" rx="12" fill="#3d1620" stroke="#ff6b81"/>
    <text x="758" y="128" fill="#ffffff" font-size="15" font-weight="700">Tier 4 = refused</text>
    <text x="758" y="152" fill="#ffd0d8" font-size="13">No data on either drug:</text>
    <text x="758" y="170" fill="#ffd0d8" font-size="13">"test each drug alone</text>
    <text x="758" y="188" fill="#ffd0d8" font-size="13">first". No guess.</text>
  </g>
  <line x1="222" y1="148" x2="258" y2="148" stroke="#8b93b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="462" y1="148" x2="498" y2="148" stroke="#8b93b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="702" y1="148" x2="738" y2="148" stroke="#8b93b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- down -->
  <path d="M602,196 L602,232 L812,232 L812,262" fill="none" stroke="#8b93b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="618" y="226" fill="#a9b0d6" font-size="12">tiers 1–3: top picks</text>

  <!-- row 2 (right to left) -->
  <g>
    <rect x="712" y="266" width="216" height="104" rx="12" fill="#2a1f5c" stroke="#7c6cf0"/>
    <text x="728" y="294" fill="#ffffff" font-size="15" font-weight="700">4 · Research agent</text>
    <text x="728" y="316" fill="#c9c1ff" font-size="12.5" font-family="ui-monospace, Menlo, monospace">gemini-3.8-flash</text>
    <text x="728" y="338" fill="#cfd4f0" font-size="13">+ Google Search: mechanism,</text>
    <text x="728" y="356" fill="#cfd4f0" font-size="13">papers, safety warnings</text>
  </g>
  <g>
    <rect x="462" y="266" width="210" height="104" rx="12" fill="#2a1f5c" stroke="#7c6cf0"/>
    <text x="478" y="294" fill="#ffffff" font-size="15" font-weight="700">5 · Checker agent</text>
    <text x="478" y="316" fill="#c9c1ff" font-size="12.5" font-family="ui-monospace, Menlo, monospace">gemini-3.5-flash-lite</text>
    <text x="478" y="338" fill="#cfd4f0" font-size="13">+ Python rules: was each</text>
    <text x="478" y="356" fill="#cfd4f0" font-size="13">source really fetched?</text>
  </g>
  <g>
    <rect x="232" y="266" width="190" height="104" rx="12" fill="#3a2e0c" stroke="#f5c542"/>
    <text x="248" y="294" fill="#ffffff" font-size="15" font-weight="700">6 · Human sign-off</text>
    <text x="248" y="318" fill="#ffe7a3" font-size="13">Scientist ticks which</text>
    <text x="248" y="336" fill="#ffe7a3" font-size="13">pairs go into the next</text>
    <text x="248" y="354" fill="#ffe7a3" font-size="13">lab batch</text>
  </g>
  <g>
    <rect x="32" y="266" width="160" height="104" rx="12" fill="#1b2350" stroke="#3a4486"/>
    <text x="48" y="294" fill="#ffffff" font-size="15" font-weight="700">7 · Report</text>
    <text x="48" y="318" fill="#cfd4f0" font-size="13">Ranked pairs, tier,</text>
    <text x="48" y="336" fill="#cfd4f0" font-size="13">interval, sources,</text>
    <text x="48" y="354" fill="#cfd4f0" font-size="13">checks passed</text>
  </g>
  <line x1="712" y1="318" x2="676" y2="318" stroke="#8b93b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="462" y1="318" x2="426" y2="318" stroke="#8b93b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="232" y1="318" x2="196" y2="318" stroke="#8b93b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="478" y="392" fill="#ff9aab" font-size="12">fails a check → dropped or flagged</text>

  <!-- audit strip -->
  <rect x="32" y="416" width="896" height="72" rx="12" fill="#121836" stroke="#3a4486" stroke-dasharray="6 5"/>
  <text x="52" y="446" fill="#ffffff" font-size="15" font-weight="700">Receipt for every run</text>
  <text x="52" y="470" fill="#a9b0d6" font-size="13">Each model call, tool call, check and approval is written to runs/&lt;time&gt;.jsonl so a scientist (or a judge) can replay why a pair was picked.</text>
</svg>
